name: Weekly numbers

on:
  schedule:
    # 매주 일요일 00:05 KST (= 토요일 15:05 UTC)
    - cron: "5 15 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-numbers
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # private 저장소일 때만 설정 (README 참고). 비어 있으면 마지막 단계는 건너뜀.
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Generate numbers
        run: npm run generate

      - name: Commit and push
        run: |
          DRAW_DATE=$(node -p "require('./public/data/latest.json').drawDate")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "chore: weekly numbers for ${DRAW_DATE}"
          git push

      - name: Trigger Vercel deploy (private repo only)
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
